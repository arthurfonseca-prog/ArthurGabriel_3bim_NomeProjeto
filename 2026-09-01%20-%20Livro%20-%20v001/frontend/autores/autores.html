<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRUD Autor</title>

    <link rel="stylesheet" href="autores.css">
</head>

<body onload="inicializar()">

    <header>
        <h1>Cadastro de Autores</h1>
        <p>Gerencie os autores cadastrados na biblioteca.</p>
    </header>

    <main class="container-master">

        <div class="conteudo-principal">

            <!-- LADO ESQUERDO -->
            <section class="form-esquerda">

                <h2>Dados do Autor</h2>

                <!-- ID -->
                <label for="inputId_autor">ID do Autor</label>

                <div class="linha-id">

                    <input
                        type="text"
                        id="inputId_autor"
                        placeholder="Ex: 1"
                    >

                    <input
                        type="button"
                        value="Procurar"
                        id="btProcurar"
                        onclick="procurar()"
                    >

                    <input
                        type="button"
                        value="Inserir"
                        id="btInserir"
                        onclick="inserir()"
                        style="display:none;"
                    >

                    <input
                        type="button"
                        value="Alterar"
                        id="btAlterar"
                        onclick="alterar()"
                        style="display:none;"
                    >

                    <input
                        type="button"
                        value="Excluir"
                        id="btExcluir"
                        onclick="excluir()"
                        style="display:none;"
                    >

                </div>


                <!-- NOME -->
                <label for="inputNome_autor">
                    Nome do Autor
                </label>

                <input
                    type="text"
                    id="inputNome_autor"
                    placeholder="Ex: Machado de Assis"
                >


                <!-- BIOGRAFIA -->
                <label for="inputBiografia_autor">
                    Biografia
                </label>

                <textarea
                    id="inputBiografia_autor"
                    rows="8"
                    placeholder="Digite uma breve biografia do autor..."
                ></textarea>


                <!-- AVISO -->
                <div id="divAviso">
                    Informe o ID e clique em Procurar
                </div>


                <!-- BOTÕES -->
                <div class="botoes-acao">

                    <input
                        type="button"
                        value="Salvar"
                        id="btSalvar"
                        onclick="salvar()"
                        style="display:none;"
                    >

                    <input
                        type="button"
                        value="Cancelar"
                        id="btCancelar"
                        onclick="cancelarOperacao()"
                        style="display:none;"
                    >

                </div>

            </section>


            <!-- LADO DIREITO -->
            <aside class="form-direita">

                <h2>Foto do Autor</h2>

                <p class="instrucao-imagem">
                    Clique na imagem para alterar
                </p>

                <div class="img-container">

                    <img
                        id="imgAutor"
                        src="http://localhost:3001/imagens/silhueta.png"
                        alt="Foto do Autor"
                        onclick="acionarUpload()"
                    >

                    <input
                        type="file"
                        id="inputImagem"
                        accept="image/*"
                        style="display:none;"
                        onchange="previewImagem()"
                    >

                </div>

            </aside>

        </div>


        <!-- LISTA -->
        <section class="lista-autor">

            <h3>Autores Cadastrados</h3>

            <div id="outputSaida">
                Carregando...
            </div>

        </section>

    </main>


    <footer>
        <p>
            &copy; 2026 Sistema de Gerenciamento de Biblioteca.
            Todos os direitos reservados.
        </p>
    </footer>


    <script src="./autores.js"></script>

</body>

</html>
