<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRUD Livro</title>

    <link rel="stylesheet" href="livro.css">
</head>

<body onload="inicializar()">

    <header>
        <h1>Cadastro de Livros</h1>
        <p>Gerencie os livros cadastrados no sistema da biblioteca.</p>
    </header>


    <main class="container-master">

        <div class="conteudo-principal">

            <!-- =========================
                 DADOS DO LIVRO
            ========================== -->
            <section class="form-esquerda">

                <h2>Dados do Livro</h2>


                <!-- ID + BOTÕES PRINCIPAIS -->
                <label for="inputId_livro">ID do Livro</label>

                <div class="linha-id">

                    <input
                        type="text"
                        name="inputId_livro"
                        id="inputId_livro"
                        placeholder="Ex: 1"
                    >

                    <input
                        type="button"
                        value="Procure"
                        id="btProcure"
                        onclick="procure()"
                    >

                    <input
                        type="button"
                        value="Inserir"
                        id="btInserir"
                        onclick="inserir()"
                        style="display:none;"
                    >

                    <input
                        type="button"
                        value="Alterar"
                        id="btAlterar"
                        onclick="alterar()"
                        style="display:none;"
                    >

                    <input
                        type="button"
                        value="Excluir"
                        id="btExcluir"
                        onclick="excluir()"
                        style="display:none;"
                    >

                </div>


                <!-- TÍTULO -->
                <label for="inputTitulo">Título</label>

                <input
                    type="text"
                    name="inputTitulo"
                    id="inputTitulo"
                >


                <!-- ANO -->
                <label for="inputAno_publicacao">
                    Ano de Publicação
                </label>

                <input
                    type="number"
                    name="inputAno_publicacao"
                    id="inputAno_publicacao"
                >


                <!-- SINOPSE -->
                <label for="inputSinopse">Sinopse</label>

                <textarea
                    name="inputSinopse"
                    id="inputSinopse"
                    rows="5"
                    placeholder="Digite a sinopse do livro..."
                ></textarea>


                <!-- EDITORA -->
                <label for="selectId_editora">Editora</label>

                <select
                    name="selectId_editora"
                    id="selectId_editora"
                >
                    <option value="">Carregando...</option>
                </select>


                <!-- GÊNERO -->
                <label for="selectId_genero">Gênero</label>

                <select
                    name="selectId_genero"
                    id="selectId_genero"
                >
                    <option value="">Carregando...</option>
                </select>


                <!-- AVISO -->
                <div id="divAviso">
                    Informe o ID e clique em Procure
                </div>


                <!-- SALVAR / CANCELAR -->
                <div class="botoes-acao">

                    <input
                        type="button"
                        value="Salvar"
                        id="btSalvar"
                        onclick="salvar()"
                        style="display:none;"
                    >

                    <input
                        type="button"
                        value="Cancelar"
                        id="btCancelar"
                        onclick="cancelarOperacao()"
                        style="display:none;"
                    >

                </div>

            </section>


            <!-- =========================
                 IMAGEM DO LIVRO
            ========================== -->
            <aside class="form-direita">

                <h2>Imagem da Capa</h2>

                <p class="instrucao-imagem">
                    (Clique na imagem para alterar)
                </p>

                <div class="img-container">

                    <img
                        id="imgLivro"
                        src="http://localhost:3001/imagens/silhueta.png"
                        alt="Imagem da capa do livro"
                        onclick="acionarUpload()"
                    >

                    <input
                        type="file"
                        id="inputImagem"
                        accept="image/*"
                        style="display:none;"
                        onchange="previewImagem()"
                    >

                </div>

            </aside>

        </div>


        <!-- =========================
             LISTA DE LIVROS
        ========================== -->
        <section class="lista-livros">

            <h3>Livros Cadastrados</h3>

            <div id="outputSaida">
                Carregando...
            </div>

        </section>

    </main>


    <footer>

        <p>
            Arthur Fonseca - 2º ano - 2026
        </p>

    </footer>


    <script src="./livro.js"></script>

</body>

</html>
